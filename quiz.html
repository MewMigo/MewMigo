<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cat Product Finder | MewMigo</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header"><div class="container nav"><a class="logo" href="index.html"><img src="images/mewmigo-logo.png" alt="MewMigo - Good cat friends deserve good cat stuff." class="logo-image"></a><button class="menu-toggle">☰</button><nav><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="guides.html">Guides</a><a href="about.html">About</a></nav></div></header>
<main><section class="page-hero"><div class="container"><p class="eyebrow">PRODUCT FINDER</p><h1>What does your cat need?</h1><p>This simple starter quiz filters the site's products. It is a shopping aid, not veterinary advice.</p></div></section>
<section class="section"><div class="container quiz"><label>What are you shopping for?<select id="need"><option value="all">A little bit of everything</option><option value="toys">Play & enrichment</option><option value="furniture">Furniture & scratching</option><option value="feeding">Food & water</option><option value="litter">Litter setup</option><option value="grooming">Grooming</option><option value="travel">Travel & safety</option></select></label><button class="btn primary" id="find">Show my products</button><div id="results" class="product-grid"></div></div></section></main>
<footer><div class="container copyright">© 2026 MewMigo</div></footer>
<script src="products.js"></script><script>
document.querySelector("#find").addEventListener("click",()=>{const c=document.querySelector("#need").value;const list=c==="all"?PRODUCTS.slice(0,12):PRODUCTS.filter(p=>p.category===c);document.querySelector("#results").innerHTML=list.map(p=>`<article class="product-card"><div class="product-icon">${p.icon}</div><div class="product-body"><span class="pill">${p.bestFor}</span><h3>${p.name}</h3><p>${p.description}</p><a class="btn small primary" href="${p.url}" target="_blank" rel="nofollow sponsored noopener">Check price at ${p.retailer} →</a></div></article>`).join("")});
</script></body></html>
